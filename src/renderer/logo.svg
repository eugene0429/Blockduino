<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa6ff"/>
      <stop offset="1" stop-color="#2e6cd6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a99a4"/>
      <stop offset="1" stop-color="#0b6b75"/>
    </linearGradient>
  </defs>

  <!-- 둥근 배경 -->
  <rect x="16" y="16" width="480" height="480" rx="114" fill="url(#bg)"/>

  <!-- 블록 그림자 -->
  <path d="M 132 168 H 230 A 26 26 0 0 1 282 168 H 380
           Q 408 168 408 196 V 364 Q 408 392 380 392 H 282
           A 26 26 0 0 1 230 392 H 132
           Q 104 392 104 364 V 196 Q 104 168 132 168 Z"
        transform="translate(0 13)" fill="#1e50b0" opacity="0.35"/>

  <!-- 퍼즐 블록 (볼록이와 탭 모두 중앙 정렬) -->
  <path d="M 132 168 H 230 A 26 26 0 0 1 282 168 H 380
           Q 408 168 408 196 V 364 Q 408 392 380 392 H 282
           A 26 26 0 0 1 230 392 H 132
           Q 104 392 104 364 V 196 Q 104 168 132 168 Z"
        fill="#ffffff"/>

  <!-- 칩 다리 (좌우 대칭, 몸통에 붙임) -->
  <g fill="#dfae3c">
    <rect x="156" y="245" width="28" height="14" rx="7"/>
    <rect x="156" y="273" width="28" height="14" rx="7"/>
    <rect x="156" y="301" width="28" height="14" rx="7"/>
    <rect x="328" y="245" width="28" height="14" rx="7"/>
    <rect x="328" y="273" width="28" height="14" rx="7"/>
    <rect x="328" y="301" width="28" height="14" rx="7"/>
  </g>

  <!-- 아두이노 칩 (블록 정중앙) -->
  <rect x="182" y="228" width="148" height="104" rx="18" fill="url(#chip)"/>
  <circle cx="202" cy="248" r="5" fill="#ffffff" opacity="0.35"/>

  <!-- 번개 (칩 정중앙) -->
  <path d="M 264.8 236 L 220.8 288.8 H 251.6 L 247.2 324 L 291.2 271.2 H 260.4 Z"
        fill="#ffd54f"/>
</svg>

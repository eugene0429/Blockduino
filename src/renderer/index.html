<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blockduino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Text is filled in from src/shared/locales/*.js via data-i18n* attributes (see renderer.js). -->
  <header id="toolbar">
    <img id="app-logo" src="logo.svg" alt="Blockduino" title="Blockduino" />
    <input id="project-name" value="New Project" />
    <button id="btn-open" data-i18n="toolbar.open">Open</button>
    <button id="btn-save" data-i18n="toolbar.save">Save</button>
    <select id="example-select"><option value="" data-i18n="toolbar.examples">Open example…</option></select>
    <button id="btn-answer" data-i18n="toolbar.answer" disabled>Show answer</button>
    <span class="spacer"></span>
    <label id="serial-toggle-row" data-i18n-title="toolbar.serialTitle" title="Check that sensor values are coming in">
      <input type="checkbox" id="serial-toggle" /> <span data-i18n="toolbar.serial">🔍 Sensor values</span>
    </label>
    <select id="port-select"><option value="">Connect a board</option></select>
    <button id="btn-upload" data-i18n="toolbar.upload">⬆ Upload</button>
    <select id="lang-select" data-i18n-title="toolbar.language" title="Language"></select>
  </header>
  <main>
    <div id="blocklyDiv"></div>
    <aside id="side-panel">
      <nav>
        <button id="tab-code" class="active" data-i18n="tab.code">Code</button>
        <button id="tab-wiring" data-i18n="tab.wiring">Wiring</button>
      </nav>
      <pre id="code-preview"></pre>
      <div id="wiring-container" hidden>
        <label id="wiring-lock-row">
          <input type="checkbox" id="wiring-lock" disabled />
          <span data-i18n="wiring.lock">Lock wiring</span>
        </label>
        <div id="wiring-panel"></div>
      </div>
    </aside>
  </main>
  <section id="serial-panel" hidden>
    <div id="serial-head">
      <span data-i18n="serial.title">🔍 Serial monitor — sensor values</span>
      <span class="spacer"></span>
      <button id="serial-clear" data-i18n="serial.clear">Clear</button>
      <button id="serial-close" data-i18n="serial.close">Close</button>
    </div>
    <pre id="serial-log"></pre>
  </section>
  <footer id="status-bar" data-i18n="status.ready">Ready</footer>
  <dialog id="answer-dialog">
    <h3 data-i18n="answer.title">Teacher check</h3>
    <p data-i18n="answer.prompt">Enter the admin password to see the answer blocks.</p>
    <input id="answer-password" type="password" data-i18n-placeholder="answer.placeholder" placeholder="Password" />
    <p id="answer-error" data-i18n="answer.wrong" hidden>Wrong password.</p>
    <div class="dialog-actions">
      <button id="answer-cancel" data-i18n="dialog.cancel">Cancel</button>
      <button id="answer-ok" data-i18n="dialog.ok">OK</button>
    </div>
  </dialog>
  <dialog id="error-dialog">
    <h3 id="error-message"></h3>
    <p id="ch340-hint" hidden>
      <span data-i18n="error.ch340.line1"></span><br />
      <span data-i18n="error.ch340.line2"></span>
    </p>
    <details><summary data-i18n="error.details">Show details</summary><pre id="error-detail"></pre></details>
    <button id="error-close" data-i18n="dialog.close">Close</button>
  </dialog>
  <script src="renderer.js"></script>
</body>
</html>

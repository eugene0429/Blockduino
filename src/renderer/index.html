<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Blockduino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="toolbar">
    <img id="app-logo" src="logo.svg" alt="Blockduino" title="Blockduino" />
    <input id="project-name" value="새 프로젝트" />
    <button id="btn-open">열기</button>
    <button id="btn-save">저장</button>
    <select id="example-select"><option value="">예제 열기…</option></select>
    <button id="btn-answer" disabled>정답 보기</button>
    <span class="spacer"></span>
    <select id="port-select"><option value="">보드를 연결하세요</option></select>
    <button id="btn-upload">⬆ 업로드</button>
  </header>
  <main>
    <div id="blocklyDiv"></div>
    <aside id="side-panel">
      <nav>
        <button id="tab-code" class="active">코드</button>
        <button id="tab-wiring">배선</button>
      </nav>
      <pre id="code-preview"></pre>
      <div id="wiring-container" hidden>
        <label id="wiring-lock-row">
          <input type="checkbox" id="wiring-lock" disabled />
          배선 고정 — 블록과 상관없이 예제의 정답 배선을 보여줘요
        </label>
        <div id="wiring-panel"></div>
      </div>
    </aside>
  </main>
  <footer id="status-bar">준비됨</footer>
  <dialog id="answer-dialog">
    <h3>선생님 확인</h3>
    <p>정답 블록을 보려면 관리자 비밀번호를 입력하세요.</p>
    <input id="answer-password" type="password" placeholder="비밀번호" />
    <p id="answer-error" hidden>비밀번호가 맞지 않아요.</p>
    <div class="dialog-actions">
      <button id="answer-cancel">취소</button>
      <button id="answer-ok">확인</button>
    </div>
  </dialog>
  <dialog id="error-dialog">
    <h3 id="error-message"></h3>
    <p id="ch340-hint" hidden>
      포트가 보이지 않으면 CH340 드라이버가 필요할 수 있어요.<br />
      선생님과 함께 "CH340 드라이버"를 검색해 설치한 뒤 다시 연결해 보세요.
    </p>
    <details><summary>자세히 보기</summary><pre id="error-detail"></pre></details>
    <button id="error-close">닫기</button>
  </dialog>
  <script src="renderer.js"></script>
</body>
</html>

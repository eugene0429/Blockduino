name: Build Windows Installer

# The Windows Arduino toolchain can't be prepared on macOS, so this workflow
# provisions vendor/arduino/win32 on a Windows runner and builds the NSIS installer.
# Download the installer from the run's artifacts and test it on a real Windows PC.

on:
  push:
    branches: [main, feature/blockduino-v1]
  pull_request:
    branches: [main]
  workflow_dispatch: # can also be started manually from the Actions tab

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    name: Build NSIS Installer (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Downloads arduino-cli.exe, the AVR core/toolchain (avr-gcc.exe, avrdude.exe)
      # and libraries as native Windows binaries into vendor/arduino/win32.
      # electron-builder bundles that folder via extraResources.
      - name: Provision Windows Arduino toolchain
        run: npm run prepare-arduino

      - name: Verify win32 toolchain exists
        shell: pwsh
        run: |
          if (-not (Test-Path "vendor/arduino/win32/arduino-cli.exe")) {
            Write-Error "arduino-cli.exe is missing — prepare-arduino failed"
            exit 1
          }
          Get-ChildItem vendor/arduino/win32 | Select-Object Name, Length

      # --publish never: stop electron-builder from trying to upload a release.
      # There is no code-signing certificate, so the installer is unsigned (fine for testing).
      - name: Build NSIS installer
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockduino-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

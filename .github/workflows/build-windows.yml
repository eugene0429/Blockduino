name: Build Windows Installer

# 로컬(macOS)에서는 Windows용 아두이노 툴체인을 만들 수 없으므로,
# Windows 러너에서 vendor/arduino/win32 를 직접 provisioning 한 뒤 NSIS 설치본을 빌드한다.
# 산출물은 Actions 아티팩트로 내려받아 실제 Windows 환경에서 테스트한다.

on:
  push:
    branches: [main, feature/blockduino-v1]
  pull_request:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    name: Build NSIS Installer (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # arduino-cli.exe + AVR 코어/툴체인(avr-gcc.exe, avrdude.exe) + 라이브러리를
      # Windows 네이티브 바이너리로 내려받아 vendor/arduino/win32 를 채운다.
      # electron-builder 의 extraResources 가 이 폴더를 번들한다.
      - name: Provision Windows Arduino toolchain
        run: npm run prepare-arduino

      - name: Verify win32 toolchain exists
        shell: pwsh
        run: |
          if (-not (Test-Path "vendor/arduino/win32/arduino-cli.exe")) {
            Write-Error "arduino-cli.exe 가 없습니다 — prepare-arduino 실패"
            exit 1
          }
          Get-ChildItem vendor/arduino/win32 | Select-Object Name, Length

      # --publish never: electron-builder 가 릴리스 업로드를 시도하지 않도록 막는다.
      # 코드 서명 인증서가 없으므로 서명되지 않은 설치본이 생성된다(테스트용으로 충분).
      - name: Build NSIS installer
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockduino-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
